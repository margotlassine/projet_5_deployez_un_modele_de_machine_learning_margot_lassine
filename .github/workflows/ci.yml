name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'test' || 'dev' }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Afficher l'environnement
        run: echo "Environnement ${{ vars.APP_ENV }}"

      - name: Lancer les tests
        run: pytest

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-couverture
          path: htmlcov/

  deploy:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Déployer
        run: echo "Déploiement en environnement ${{ vars.APP_ENV }}"